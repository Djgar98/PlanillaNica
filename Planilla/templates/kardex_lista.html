<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kardex de Inventario - PlanillaNica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include '_nav.html' %}

    <main class="container pb-5">
        <div class="row align-items-center mb-4">
            <div class="col">
                <h3 class="fw-bold mb-1"><i class="bi bi-journal-text text-primary me-2"></i> Kardex de Inventario</h3>
                <p class="text-muted small mb-0">Selecciona un producto para ver su historial de movimientos.</p>
            </div>
        </div>

        <div class="row g-3">
            {% for prod in productos %}
            <div class="col-md-4 col-lg-3">
                <a href="{{ url_for('kardex_producto', producto_id=prod.id) }}" class="card bg-white shadow-sm h-100 text-decoration-none text-dark hover-lift">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <p class="small text-muted mb-1 text-truncate">{{ prod.codigo }}</p>
                            <p class="fw-semibold mb-2">{{ prod.nombre }}</p>
                        </div>
                        <div class="d-flex align-items-center justify-content-between mt-2">
                            <span class="text-muted small">Stock actual</span>
                            <span class="badge bg-primary fs-6 px-3">{{ prod.existencia }}</span>
                        </div>
                    </div>
                </a>
            </div>
            {% else %}
            <div class="col-12">
                <div class="card bg-white shadow-sm text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <p class="mt-2 text-muted">No hay productos registrados.</p>
                    <a href="{{ url_for('nuevo_producto') }}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Agregar Producto
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .hover-lift { transition: transform .15s ease, box-shadow .15s ease; }
        .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.1) !important; }
    </style>
</body>
</html>
