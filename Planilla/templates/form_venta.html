<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - PlanillaNica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include '_nav.html' %}

    <main class="container pb-5">
        <div class="row mb-4">
            <div class="col-12">
                <a href="{{ url_for('ventas') }}" class="text-decoration-none text-muted mb-2 d-inline-block">
                    <i class="bi bi-arrow-left"></i> Volver a Ventas
                </a>
                <h3 class="fw-bold text-slate-800">Registrar Nueva Venta</h3>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} mb-4">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card bg-white shadow-sm">
            <div class="card-body p-4">
                <form action="{{ url_for('nueva_venta') }}" method="POST" id="formVenta">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="mb-4">
                        <label for="cliente" class="form-label fw-semibold">Nombre del Cliente (Opcional)</label>
                        <input type="text" class="form-control" id="cliente" name="cliente" placeholder="Consumidor Final">
                    </div>

                    <h5 class="fw-bold mb-3 border-bottom pb-2">Productos</h5>
                    
                    <div id="lineas-venta">
                        <!-- Línea 1 -->
                        <div class="row g-2 mb-3 align-items-center linea-producto">
                            <div class="col-md-7">
                                <select name="producto_id" class="form-select select-producto" required>
                                    <option value="">-- Seleccionar Producto --</option>
                                    {% for p in productos %}
                                        <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}" data-stock="{{ p.existencia }}">
                                            {{ p.codigo }} - {{ p.nombre }} (C$ {{ p.precio_venta }}) | Stock: {{ p.existencia }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" name="cantidad" class="form-control input-cantidad" placeholder="Cantidad" min="1" required>
                            </div>
                            <div class="col-md-2 text-end">
                                <button type="button" class="btn btn-outline-danger btn-eliminar-linea" disabled>
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btn-agregar-linea">
                            <i class="bi bi-plus-circle me-1"></i> Agregar otro producto
                        </button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <h4 class="fw-bold mb-0 text-slate-800">Total Estimado: <span id="total-estimado" class="text-success">C$ 0.00</span></h4>
                        <button type="submit" class="btn btn-success px-4 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Completar Venta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Template oculto para clonar -->
    <div id="template-linea" class="d-none">
        <div class="row g-2 mb-3 align-items-center linea-producto">
            <div class="col-md-7">
                <select name="producto_id" class="form-select select-producto" required>
                    <option value="">-- Seleccionar Producto --</option>
                    {% for p in productos %}
                        <option value="{{ p.id }}" data-precio="{{ p.precio_venta }}" data-stock="{{ p.existencia }}">
                            {{ p.codigo }} - {{ p.nombre }} (C$ {{ p.precio_venta }}) | Stock: {{ p.existencia }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <input type="number" name="cantidad" class="form-control input-cantidad" placeholder="Cantidad" min="1" required>
            </div>
            <div class="col-md-2 text-end">
                <button type="button" class="btn btn-outline-danger btn-eliminar-linea">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('lineas-venta');
            const btnAgregar = document.getElementById('btn-agregar-linea');
            const template = document.getElementById('template-linea');
            const totalEstimado = document.getElementById('total-estimado');

            function calcularTotal() {
                let total = 0;
                document.querySelectorAll('.linea-producto').forEach(function(linea) {
                    if (linea.parentElement.id === 'template-linea') return;
                    
                    const select = linea.querySelector('.select-producto');
                    const input = linea.querySelector('.input-cantidad');
                    
                    if (select.value && input.value) {
                        const precio = parseFloat(select.options[select.selectedIndex].dataset.precio || 0);
                        const cantidad = parseInt(input.value || 0);
                        total += (precio * cantidad);
                    }
                });
                totalEstimado.textContent = 'C$ ' + total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }

            container.addEventListener('change', function(e) {
                if (e.target.classList.contains('select-producto')) {
                    const option = e.target.options[e.target.selectedIndex];
                    const stock = parseInt(option.dataset.stock || 0);
                    const row = e.target.closest('.linea-producto');
                    const inputCantidad = row.querySelector('.input-cantidad');
                    if (stock > 0) {
                        inputCantidad.max = stock;
                    }
                    calcularTotal();
                }
            });

            container.addEventListener('input', function(e) {
                if (e.target.classList.contains('input-cantidad')) {
                    calcularTotal();
                }
            });

            container.addEventListener('click', function(e) {
                if (e.target.closest('.btn-eliminar-linea')) {
                    const row = e.target.closest('.linea-producto');
                    row.remove();
                    
                    const lineas = container.querySelectorAll('.linea-producto');
                    if (lineas.length === 1) {
                        lineas[0].querySelector('.btn-eliminar-linea').disabled = true;
                    }
                    calcularTotal();
                }
            });

            btnAgregar.addEventListener('click', function() {
                const nuevaLinea = template.querySelector('.linea-producto').cloneNode(true);
                container.appendChild(nuevaLinea);
                
                // Habilitar todos los botones de eliminar
                container.querySelectorAll('.btn-eliminar-linea').forEach(btn => btn.disabled = false);
            });
        });
    </script>
</body>
</html>
